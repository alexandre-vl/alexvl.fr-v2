name: build-and-deploy

# CI/CD: build the app image from source, push it to GHCR under the k8s-alexvl org,
# then bump the image tag in the k8s-alexvl/cluster GitOps repo so Argo CD deploys it.
# Auth: GHCR_PAT repo secret (write:packages on k8s-alexvl + repo on the cluster).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/k8s-alexvl/alexvlfr
  CLUSTER_MANIFEST: stacks/websites/alexvlfr/deployment.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compute image tag (short SHA)
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy — bump image tag in cluster repo
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/k8s-alexvl/cluster.git" _cluster
          cd _cluster
          sed -i -E "s#(image: ${IMAGE}:)[^[:space:]]+#\1${{ steps.tag.outputs.sha }}#" "${CLUSTER_MANIFEST}"
          if git diff --quiet; then
            echo "Cluster manifest already at ${{ steps.tag.outputs.sha }} — nothing to deploy."
            exit 0
          fi
          git config user.name "alexvl-ci[bot]"
          git config user.email "ci@k8s-alexvl.local"
          git commit -am "deploy(alexvlfr): ${{ steps.tag.outputs.sha }}"
          git push origin main
